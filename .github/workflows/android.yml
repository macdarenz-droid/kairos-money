name: Android foundation gate
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kairos-money-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/test-money-lint.mjs
      - run: python3 scripts/test-native-gate.py
      - run: npm run dev:fixtures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install sqlcipher3-binary==0.6.0
      - run: python scripts/verify-encryption.py
      - run: git diff --exit-code -- docs/SCHEMA.md docs/CONTRAST.md src/ui/design/tokens.css
  android-gate:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # Google withdrew the obsolete 'tools' package, so the action's default package set now
          # fails sdkmanager with "Failed to find package 'tools'". adb comes from platform-tools;
          # the platform and build-tools this gate needs are installed explicitly below.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kairos-money-debug-signing-v1
      # A cache is evicted after a week unused, and a rotated key means every phone with the previous
      # build refuses the new one. When the keystore is held as a secret instead, it never rotates.
      # The secret is optional: without it the cache above still works.
      - name: Use the pinned development keystore when one is configured
        if: env.ANDROID_DEBUG_KEYSTORE_B64 != ''
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      # WITHOUT THIS THE CACHE ABOVE HAS NOTHING TO SAVE, and it never has.
      #
      # Every run ended with "Path Validation Error: Path(s) specified in the action for caching do(es)
      # not exist", because Gradle generates its debug key somewhere the cache was not looking. So the
      # restore always missed, a NEW key was generated every build, and every APK was signed by a
      # different identity — which is precisely why an update refuses to install over the copy already
      # on a phone. The cache was not expiring; it was never working.
      #
      # Creating the keystore here puts it at the path Gradle's default debug config reads AND the path
      # the cache saves, with the conventional debug alias and password. It is made once and then
      # restored, so the identity stops moving.
      - name: Create the development keystore if the cache did not restore one
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new development keystore; the signing identity has changed."
          else
            echo "Restored the existing development keystore; the signing identity is unchanged."
          fi
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: npm ci
      - run: npm run android:sync
      - name: Generate synthetic instrumentation ledger
        run: node --import tsx scripts/native-ledger-fixture.ts
      - name: Build benchmark, debug and instrumentation APKs
        working-directory: android
        run: ./gradlew :app:assembleBenchmark :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Verify the signing identity has not rotated
        run: python3 scripts/verify-signing-identity.py android/app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME"
      - name: Verify non-debuggable benchmark APK
        run: python3 scripts/verify-benchmark-apk.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reserve space for the Android test device
        run: |
          df -h .
          # This disposable runner has already compiled the APKs. These SDKs are unused.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup
          python - <<'PYSPACE'
          import json, shutil
          from pathlib import Path
          free = shutil.disk_usage('.').free
          minimum = 16 * 1024**3
          report = {'free_bytes': free, 'minimum_bytes': minimum, 'status': 'PASS' if free >= minimum else 'FAIL'}
          Path('docs/evidence/ci-disk-space.json').write_text(json.dumps(report, indent=2) + '\n')
          Path('docs/evidence/native-run-status.json').write_text(json.dumps({'status': 'NOT RUN', 'reason': 'Native gate has not completed on this CI run. Read the workflow log for emulator startup failures.'}, indent=2) + '\n')
          print(json.dumps(report))
          if free < minimum:
              raise SystemExit('Insufficient free space for the Android system image and userdata partition.')
          PYSPACE
      - name: Native encryption, app flow and theme gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: true
          script: |
            python scripts/run-native-gate.py
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kairos-money-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # The same check again, as the last thing the job prints.
      #
      # The verification itself belongs before the emulator, so a rotated key fails in seconds instead of
      # thirteen minutes later. But that puts its output thousands of logcat lines from the end, and the
      # log is only readable from the tail — so the one value somebody has to ACT on was the one value
      # buried deepest. Printing it again at the end costs a second and makes it reachable.
      - name: Signing identity, repeated at the end of the log so it can be read
        if: always()
        run: python3 scripts/verify-signing-identity.py android/app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME"
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-money-gate-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            docs/evidence/
          retention-days: 30
