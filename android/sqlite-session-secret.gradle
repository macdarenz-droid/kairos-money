// Only the pinned 6.0.2 secret-storage adapter is replaced; upstream sources stay untouched.
project(':capacitor-community-sqlite') { sqliteProject ->
    afterEvaluate {
        def original = sqliteProject.file('src/main/java/com/getcapacitor/community/database/sqlite/SQLite/UtilsSecret.java')
        def output = sqliteProject.layout.buildDirectory.dir('generated/kairos-session-secret').get().asFile
        def generate = sqliteProject.tasks.register('generateKairosSessionSecret') {
            inputs.file(original)
            outputs.dir(output)
            doLast {
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(original.bytes).encodeHex().toString()
                if (digest != '842afb54627cc0814c639114c43c6515b437e1b81c1ad8257720f65a1161ec24') throw new GradleException('SQLite secret adapter changed. Review the pinned adapter before building.')
                def source = original.getText('UTF-8')
                source = source.replace('    public void setPassphrase(String passphrase) {\n        sharedPreferences.edit().putString("secret", passphrase).apply();\n    }', '''    public void setPassphrase(String passphrase) {
        throw new IllegalStateException("Kairos database keys must be supplied by the authenticated native vault.");
    }
    private static char[] sessionSecret;
    public static synchronized void setSessionSecret(String secret) {
        clearSessionSecret();
        if (secret == null || secret.isEmpty()) throw new IllegalArgumentException("Missing database key.");
        sessionSecret = secret.toCharArray();
    }
    public static synchronized void clearSessionSecret() {
        if (sessionSecret != null) java.util.Arrays.fill(sessionSecret, '\\0');
        sessionSecret = null;
    }
    public static synchronized void clearLegacySecret() {
        if (sharedPreferences == null || !sharedPreferences.edit().remove("secret").commit() || sharedPreferences.contains("secret"))
            throw new IllegalStateException("The legacy database key could not be removed. Free storage and retry.");
    }''')
                source = source.replace('    public static String getPassphrase() {\n        String passphrase = sharedPreferences.getString("secret", "");\n        return passphrase;\n    }', '''    public static synchronized String getPassphrase() {
        return sessionSecret == null ? "" : new String(sessionSecret);
    }''')
                def target = new File(output, 'com/getcapacitor/community/database/sqlite/SQLite/UtilsSecret.java')
                target.parentFile.mkdirs(); target.setText(source, 'UTF-8')
            }
        }
        sqliteProject.android.sourceSets.main.java.exclude { element -> element.file.canonicalFile == original.canonicalFile }
        sqliteProject.android.sourceSets.main.java.srcDir(output)
        sqliteProject.tasks.named('preBuild').configure { dependsOn(generate) }
    }
}
