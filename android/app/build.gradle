apply plugin: 'com.android.application'

def releaseStorePath = System.getenv('KAIROS_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('KAIROS_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('KAIROS_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('KAIROS_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace "app.kairos.money"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.kairos.money"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.0-rc.1"
        testInstrumentationRunner "app.kairos.money.KairosTestRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets { androidTest.assets.srcDirs += ['../../fixtures/ingest'] }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('verifyPrivateReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException('Private release signing is not configured. Set KAIROS_RELEASE_STORE_FILE, KAIROS_RELEASE_STORE_PASSWORD, KAIROS_RELEASE_KEY_ALIAS and KAIROS_RELEASE_KEY_PASSWORD.')
        }
        if (!file(releaseStorePath).isFile()) {
            throw new GradleException('KAIROS_RELEASE_STORE_FILE does not point to a readable keystore file.')
        }
    }
}

tasks.matching { task -> task.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('verifyPrivateReleaseSigning')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "androidx.startup:startup-runtime:1.1.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.biometric:biometric:1.1.0"
    androidTestImplementation "net.zetetic:android-database-sqlcipher:4.5.3"
    androidTestImplementation "androidx.sqlite:sqlite:2.4.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test:rules:1.5.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
