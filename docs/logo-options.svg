<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="700" viewBox="0 0 960 700" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <clipPath id="disc"><circle cx="50" cy="50" r="35"/></clipPath>
    <mask id="keyhole"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="42" r="10" fill="#000"/><path d="M45.5 46h9l3.5 22h-16z" fill="#000"/></mask>
    <mask id="kcut"><rect width="100" height="100" fill="#fff"/><path d="M39 29v42M39 53l21-22M46 46l15 23" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask>
    <symbol id="A" viewBox="0 0 100 100">
      <g transform="translate(-2.5 -7)"><path clip-path="url(#disc)" d="M0 0h55v50H45v50H0z" fill="#F4F1EA"/></g>
      <g transform="translate(2.5 7)"><path clip-path="url(#disc)" d="M100 0H55v50H45v50h55z" fill="#F4F1EA"/></g>
    </symbol>
    <symbol id="B" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#E8B64C" stroke-width="6"/>
      <path d="M38 30v40M38 53l24-23M45 46l17 24M51 30h11v11" stroke="#F4F1EA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </symbol>
    <symbol id="C" viewBox="0 0 100 100">
      <path d="M73.14 22.42A36 36 0 1 1 50 14" fill="none" stroke="#F4F1EA" stroke-width="7" stroke-linecap="round"/>
      <circle cx="62.31" cy="16.17" r="5" fill="#8F97FF"/>
      <rect x="34" y="56" width="8" height="14" rx="2" fill="#F4F1EA"/><rect x="46" y="47" width="8" height="23" rx="2" fill="#F4F1EA"/><rect x="58" y="37" width="8" height="33" rx="2" fill="#F4F1EA"/>
    </symbol>
    <symbol id="D" viewBox="0 0 100 100">
      <path d="M22 66v8a22 7 0 0 0 44 0v-8z" fill="#B8862A"/><ellipse cx="44" cy="66" rx="22" ry="7" fill="#E8B64C"/>
      <path d="M27 53v8a22 7 0 0 0 44 0v-8z" fill="#B8862A"/><ellipse cx="49" cy="53" rx="22" ry="7" fill="#E8B64C"/>
      <path d="M32 40v8a22 7 0 0 0 44 0v-8z" fill="#B8862A"/><ellipse cx="54" cy="40" rx="22" ry="7" fill="#F2CB6B"/>
      <path d="M79 13l2.5 5.5L87 21l-5.5 2.5L79 29l-2.5-5.5L71 21l5.5-2.5z" fill="#F4F1EA"/>
    </symbol>
    <symbol id="E" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="none" stroke="#8F97FF" stroke-width="3"/>
      <circle cx="50" cy="50" r="37" fill="#F4F1EA" mask="url(#keyhole)"/>
    </symbol>
    <symbol id="F" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="#E8B64C" mask="url(#kcut)"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="#B8862A" stroke-width="2" mask="url(#kcut)"/>
    </symbol>
  </defs>
  <rect width="960" height="700" fill="#F6F5F2"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#1B1D22">Kairos logo options</text>
  <text x="32" y="68" font-size="13" fill="#5B606B">Each shown as the app icon, in the app header on dark and light, and at favicon size. Pick one letter.</text>
  <!-- One card per option: icon tile, header sizes, favicon size, name and idea. -->
  <g transform="translate(32 92)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#A" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#A" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#A" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#A" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">A · Aperture, redrawn</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">Today's mark as clean vector:</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">sharp edges, no blotchy border.</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">Two halves: money in, money out.</text>
  </g>
  <g transform="translate(336 92)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#B" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#B" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#B" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#B" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">B · Rising K</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">A K inside a gold coin rim;</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">its top arm is an arrow going up.</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">Reads as money growing.</text>
  </g>
  <g transform="translate(640 92)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#C" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#C" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#C" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#C" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">C · The right moment</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">Kairos means "the right moment":</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">a clock ring with one bright dot,</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">and savings bars rising inside.</text>
  </g>
  <g transform="translate(32 392)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#D" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#D" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#D" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#D" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">D · Coin stack</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">Three coins stacking up, with a spark.</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">Matches the new loading animation,</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">so logo and loader feel like one.</text>
  </g>
  <g transform="translate(336 392)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#E" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#E" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#E" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#E" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">E · Vault</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">A coin with a keyhole.</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">Says what makes Kairos different:</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">your data stays locked on the phone.</text>
  </g>
  <g transform="translate(640 392)">
    <rect width="288" height="280" rx="14" fill="#FFFFFF" stroke="#E2E0DA"/>
    <rect x="20" y="20" width="128" height="128" rx="30" fill="#14161B"/><use href="#F" x="34" y="34" width="100" height="100"/>
    <rect x="168" y="20" width="48" height="48" rx="10" fill="#14161B"/><use href="#F" x="174" y="26" width="36" height="36"/>
    <rect x="224" y="20" width="48" height="48" rx="10" fill="#E9E7E1"/><rect x="230" y="26" width="36" height="36" rx="8" fill="#14161B"/><use href="#F" x="233" y="29" width="30" height="30"/>
    <rect x="168" y="84" width="20" height="20" rx="4" fill="#14161B"/><use href="#F" x="170" y="86" width="16" height="16"/>
    <text x="196" y="99" font-size="11" fill="#5B606B">favicon</text>
    <text x="20" y="190" font-size="17" font-weight="600" fill="#1B1D22">F · K coin</text>
    <text x="20" y="214" font-size="12.5" fill="#5B606B">A K cut out of a gold coin.</text>
    <text x="20" y="232" font-size="12.5" fill="#5B606B">Simplest shape; clearest at</text>
    <text x="20" y="250" font-size="12.5" fill="#5B606B">tiny sizes like the status bar.</text>
  </g>
</svg>
